<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <title>QR Transfer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --bg-card: #111111;
            --bg-secondary: #1a1a1a;
            --border: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #888888;
            --text-muted: #555555;
            --success: #22c55e;
            --error: #ef4444;
            --radius: 16px;
            --radius-sm: 10px;
        }

        html, body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: 100dvh;
        }

        .app {
            max-width: 440px;
            margin: 0 auto;
            padding: 16px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--text);
            color: var(--bg);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Input */
        .textarea {
            width: 100%;
            min-height: 100px;
            padding: 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.938rem;
            resize: vertical;
            font-family: inherit;
        }

        .textarea:focus {
            outline: none;
            border-color: var(--text-secondary);
        }

        .textarea::placeholder {
            color: var(--text-muted);
        }

        /* Buttons */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 0.938rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--text);
            color: var(--bg);
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:disabled {
            background: var(--text-muted);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-danger {
            background: var(--error);
            color: white;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .btn-group .btn {
            flex: 1;
        }

        /* QR Container */
        .qr-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .qr-box {
            background: white;
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 16px;
        }

        #qrCanvas {
            display: block;
            width: 200px;
            height: 200px;
        }

        .qr-placeholder {
            width: 200px;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            text-align: center;
            background: var(--bg-secondary);
            border-radius: var(--radius-sm);
        }

        /* Speed Control */
        .speed-section {
            width: 100%;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .speed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .speed-label {
            font-size: 0.813rem;
            color: var(--text-secondary);
        }

        .speed-value {
            font-size: 0.875rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .speed-slider {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: var(--bg-secondary);
            border-radius: 3px;
            outline: none;
        }

        .speed-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        .speed-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--text);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .speed-presets {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .preset-btn {
            padding: 8px 4px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.688rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-btn:hover,
        .preset-btn.active {
            border-color: var(--text);
            color: var(--text);
        }

        /* Progress */
        .progress-section {
            margin-top: 16px;
        }

        .progress-bar {
            height: 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--text);
            border-radius: 3px;
            transition: width 0.15s;
            width: 0%;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        /* Scanner */
        .scanner-area {
            position: relative;
            width: 100%;
            max-width: 300px;
            aspect-ratio: 1;
            margin: 0 auto;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            overflow: hidden;
        }

        #scannerVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanner-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .scanner-frame {
            position: absolute;
            inset: 15%;
            border: 2px solid var(--text);
            border-radius: 8px;
            opacity: 0.7;
        }

        .scan-line {
            position: absolute;
            left: 15%;
            right: 15%;
            height: 2px;
            background: var(--success);
            top: 15%;
            animation: scanning 2s ease-in-out infinite;
            box-shadow: 0 0 8px var(--success);
        }

        @keyframes scanning {
            0%, 100% { top: 15%; }
            50% { top: 83%; }
        }

        .scanner-status {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        /* Received Data */
        .received-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
            min-height: 120px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 0.813rem;
            word-break: break-all;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .received-box.has-data {
            border-color: var(--success);
            color: var(--success);
        }

        .received-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-item {
            background: var(--bg-secondary);
            padding: 12px;
            border-radius: var(--radius-sm);
            text-align: center;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.688rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Toast */
        .toast-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 32px);
            max-width: 380px;
        }

        .toast {
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 8px;
            animation: slideIn 0.3s ease;
            font-size: 0.875rem;
        }

        .toast.success {
            border-color: var(--success);
            color: var(--success);
        }

        .toast.error {
            border-color: var(--error);
            color: var(--error);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Chunk indicator */
        .chunk-indicator {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 12px;
        }

        .chunk-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
        }

        .chunk-dot.active {
            background: var(--text);
        }

        .chunk-dot.received {
            background: var(--success);
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>QR Transfer</h1>
            <p>Cihazlar arasi hizli veri aktarimi</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-tab="send">Gonder</button>
            <button class="tab-btn" data-tab="receive">Al</button>
        </div>

        <!-- SEND TAB -->
        <div class="tab-content active" id="tab-send">
            <div class="card">
                <div class="card-title">Gonderilecek Veri</div>
                <textarea class="textarea" id="sendData" placeholder="Gondermek istediginiz metni buraya yazin..."></textarea>
                
                <div class="btn-group">
                    <button class="btn btn-primary" id="startBtn">Gondermeye Basla</button>
                    <button class="btn btn-danger hidden" id="stopBtn">Durdur</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">QR Kod</div>
                <div class="qr-area">
                    <div class="qr-box" id="qrBox">
                        <div class="qr-placeholder" id="qrPlaceholder">Veri girin ve gondermeye baslayin</div>
                        <canvas id="qrCanvas" class="hidden"></canvas>
                    </div>

                    <div class="progress-section hidden" id="sendProgress">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-info">
                            <span id="chunkInfo">0 / 0</span>
                            <span id="byteInfo">0 byte</span>
                        </div>
                        <div class="chunk-indicator" id="chunkIndicator"></div>
                    </div>

                    <div class="speed-section">
                        <div class="speed-header">
                            <span class="speed-label">QR Degisim Hizi</span>
                            <span class="speed-value" id="speedValue">200ms</span>
                        </div>
                        <input type="range" class="speed-slider" id="speedSlider" min="30" max="2000" value="200">
                        <div class="speed-presets">
                            <button class="preset-btn" data-speed="30">Ultra</button>
                            <button class="preset-btn" data-speed="50">Cok Hizli</button>
                            <button class="preset-btn active" data-speed="200">Hizli</button>
                            <button class="preset-btn" data-speed="500">Normal</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- RECEIVE TAB -->
        <div class="tab-content" id="tab-receive">
            <div class="card">
                <div class="card-title">QR Tarayici</div>
                <div class="scanner-area" id="scannerArea">
                    <video id="scannerVideo" autoplay playsinline></video>
                    <div class="scanner-overlay">
                        <div class="scanner-frame"></div>
                        <div class="scan-line"></div>
                    </div>
                </div>
                <div class="scanner-status" id="scannerStatus">Tarayiciyi baslatmak icin asagidaki butona tiklayin</div>
                <div class="btn-group">
                    <button class="btn btn-primary" id="toggleScanner">Tarayiciyi Baslat</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Alinan Veriler</div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="receivedChunks">0</div>
                        <div class="stat-label">Parca</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalChunks">?</div>
                        <div class="stat-label">Toplam</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="receivedBytes">0</div>
                        <div class="stat-label">Byte</div>
                    </div>
                </div>
                <div class="chunk-indicator" id="receiveChunkIndicator"></div>
                <div class="received-box" id="receivedData">
                    <div class="received-empty">Henuz veri alinmadi</div>
                </div>
                <div class="btn-group">
                    <button class="btn btn-secondary" id="copyReceived">Kopyala</button>
                    <button class="btn btn-secondary" id="clearReceived">Temizle</button>
                </div>
            </div>
        </div>

        <div class="toast-container" id="toastContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script>
        // Toast System
        const Toast = {
            show(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }
        };

        // QR Transfer System
        const QRTransfer = {
            canvas: null,
            chunks: [],
            currentChunk: 0,
            interval: null,
            speed: 200,
            chunkSize: 100,
            isSending: false,

            init() {
                this.canvas = document.getElementById('qrCanvas');
                this.setupEvents();
            },

            setupEvents() {
                // Start/Stop buttons
                document.getElementById('startBtn').addEventListener('click', () => this.startSending());
                document.getElementById('stopBtn').addEventListener('click', () => this.stopSending());

                // Speed controls
                const slider = document.getElementById('speedSlider');
                slider.addEventListener('input', (e) => {
                    this.speed = parseInt(e.target.value);
                    document.getElementById('speedValue').textContent = this.speed + 'ms';
                    this.updatePresetButtons();
                    if (this.isSending) {
                        this.restartInterval();
                    }
                });

                // Preset buttons
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const speed = parseInt(btn.dataset.speed);
                        this.speed = speed;
                        slider.value = speed;
                        document.getElementById('speedValue').textContent = speed + 'ms';
                        this.updatePresetButtons();
                        if (this.isSending) {
                            this.restartInterval();
                        }
                    });
                });
            },

            updatePresetButtons() {
                document.querySelectorAll('.preset-btn').forEach(btn => {
                    const speed = parseInt(btn.dataset.speed);
                    btn.classList.toggle('active', speed === this.speed);
                });
            },

            prepareData(text) {
                // Create chunks with metadata
                const encoded = encodeURIComponent(text);
                const chunks = [];
                const totalChunks = Math.ceil(encoded.length / this.chunkSize);
                
                for (let i = 0; i < encoded.length; i += this.chunkSize) {
                    const chunkData = encoded.slice(i, i + this.chunkSize);
                    const chunkIndex = Math.floor(i / this.chunkSize);
                    // Format: QRT|chunkIndex|totalChunks|data
                    chunks.push(`QRT|${chunkIndex}|${totalChunks}|${chunkData}`);
                }
                
                return chunks;
            },

            startSending() {
                const text = document.getElementById('sendData').value.trim();
                if (!text) {
                    Toast.show('Lutfen gondermek icin metin girin', 'error');
                    return;
                }

                this.chunks = this.prepareData(text);
                this.currentChunk = 0;
                this.isSending = true;

                // Update UI
                document.getElementById('startBtn').classList.add('hidden');
                document.getElementById('stopBtn').classList.remove('hidden');
                document.getElementById('qrPlaceholder').classList.add('hidden');
                document.getElementById('qrCanvas').classList.remove('hidden');
                document.getElementById('sendProgress').classList.remove('hidden');

                // Create chunk indicators
                this.createChunkIndicators();

                // Update byte info
                document.getElementById('byteInfo').textContent = new Blob([text]).size + ' byte';

                // Start generating QR codes
                this.generateQR();
                this.interval = setInterval(() => this.generateQR(), this.speed);

                Toast.show('Gonderim basladi - ' + this.chunks.length + ' parca', 'success');
            },

            stopSending() {
                this.isSending = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }

                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('stopBtn').classList.add('hidden');

                Toast.show('Gonderim durduruldu', 'info');
            },

            restartInterval() {
                if (this.interval) {
                    clearInterval(this.interval);
                }
                this.interval = setInterval(() => this.generateQR(), this.speed);
            },

            createChunkIndicators() {
                const container = document.getElementById('chunkIndicator');
                container.innerHTML = '';
                for (let i = 0; i < this.chunks.length; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'chunk-dot';
                    dot.dataset.index = i;
                    container.appendChild(dot);
                }
            },

            generateQR() {
                if (!this.isSending || this.chunks.length === 0) return;

                const chunk = this.chunks[this.currentChunk];
                
                QRCode.toCanvas(this.canvas, chunk, {
                    width: 200,
                    margin: 1,
                    color: {
                        dark: '#000000',
                        light: '#ffffff'
                    },
                    errorCorrectionLevel: 'L'
                });

                // Update progress
                const progress = ((this.currentChunk + 1) / this.chunks.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('chunkInfo').textContent = (this.currentChunk + 1) + ' / ' + this.chunks.length;

                // Update chunk indicators
                document.querySelectorAll('#chunkIndicator .chunk-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === this.currentChunk);
                });

                // Move to next chunk (loop)
                this.currentChunk = (this.currentChunk + 1) % this.chunks.length;
            }
        };

        // QR Scanner System
        const QRScanner = {
            video: null,
            stream: null,
            isScanning: false,
            receivedChunks: new Map(),
            totalChunks: null,
            lastScan: '',
            scanInterval: null,

            init() {
                this.video = document.getElementById('scannerVideo');
                this.setupEvents();
            },

            setupEvents() {
                document.getElementById('toggleScanner').addEventListener('click', () => this.toggle());
                document.getElementById('copyReceived').addEventListener('click', () => this.copyData());
                document.getElementById('clearReceived').addEventListener('click', () => this.clearData());
            },

            async toggle() {
                if (this.isScanning) {
                    this.stop();
                } else {
                    await this.start();
                }
            },

            async start() {
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: 'environment' }
                    });
                    
                    this.video.srcObject = this.stream;
                    this.isScanning = true;
                    
                    document.getElementById('toggleScanner').textContent = 'Tarayiciyi Durdur';
                    document.getElementById('toggleScanner').classList.remove('btn-primary');
                    document.getElementById('toggleScanner').classList.add('btn-danger');
                    document.getElementById('scannerStatus').textContent = 'Tarama aktif - QR kodlari kameraya gosterin';

                    // Start scanning with canvas-based detection
                    this.startScanning();
                    
                    Toast.show('Kamera baslatildi', 'success');
                } catch (err) {
                    Toast.show('Kamera erisimi reddedildi', 'error');
                    console.error(err);
                }
            },

            stop() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                
                if (this.scanInterval) {
                    clearInterval(this.scanInterval);
                    this.scanInterval = null;
                }

                this.isScanning = false;
                this.video.srcObject = null;
                
                document.getElementById('toggleScanner').textContent = 'Tarayiciyi Baslat';
                document.getElementById('toggleScanner').classList.add('btn-primary');
                document.getElementById('toggleScanner').classList.remove('btn-danger');
                document.getElementById('scannerStatus').textContent = 'Tarayici durduruldu';
            },

            startScanning() {
                // Create a canvas for frame capture
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // Load jsQR for decoding
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js';
                script.onload = () => {
                    this.scanInterval = setInterval(() => {
                        if (!this.isScanning || !this.video.videoWidth) return;

                        canvas.width = this.video.videoWidth;
                        canvas.height = this.video.videoHeight;
                        ctx.drawImage(this.video, 0, 0);

                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height);

                        if (code && code.data && code.data !== this.lastScan) {
                            this.lastScan = code.data;
                            this.processQRData(code.data);
                            
                            // Reset lastScan after a short delay to allow re-scanning same code
                            setTimeout(() => {
                                if (this.lastScan === code.data) {
                                    this.lastScan = '';
                                }
                            }, 100);
                        }
                    }, 50); // Scan every 50ms for speed
                };
                document.head.appendChild(script);
            },

            processQRData(data) {
                // Check if it's our format: QRT|index|total|data
                if (!data.startsWith('QRT|')) {
                    // Not our format, show raw data
                    this.showRawData(data);
                    return;
                }

                const parts = data.split('|');
                if (parts.length !== 4) return;

                const chunkIndex = parseInt(parts[1]);
                const totalChunks = parseInt(parts[2]);
                const chunkData = parts[3];

                // Store chunk
                if (!this.receivedChunks.has(chunkIndex)) {
                    this.receivedChunks.set(chunkIndex, chunkData);
                    this.totalChunks = totalChunks;
                    
                    // Update UI
                    this.updateReceiveUI();

                    // Check if complete
                    if (this.receivedChunks.size === totalChunks) {
                        this.assembleData();
                    }
                }
            },

            showRawData(data) {
                const box = document.getElementById('receivedData');
                box.innerHTML = data;
                box.classList.add('has-data');
                Toast.show('QR kod okundu', 'success');
            },

            updateReceiveUI() {
                document.getElementById('receivedChunks').textContent = this.receivedChunks.size;
                document.getElementById('totalChunks').textContent = this.totalChunks || '?';

                // Update chunk indicators
                const container = document.getElementById('receiveChunkIndicator');
                container.innerHTML = '';
                
                if (this.totalChunks) {
                    for (let i = 0; i < this.totalChunks; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'chunk-dot' + (this.receivedChunks.has(i) ? ' received' : '');
                        container.appendChild(dot);
                    }
                }

                // Show progress in data box
                const box = document.getElementById('receivedData');
                const percent = this.totalChunks ? Math.round((this.receivedChunks.size / this.totalChunks) * 100) : 0;
                box.innerHTML = `Aliniyor... %${percent} (${this.receivedChunks.size}/${this.totalChunks} parca)`;
            },

            assembleData() {
                // Sort chunks and combine
                const sorted = Array.from(this.receivedChunks.entries())
                    .sort((a, b) => a[0] - b[0])
                    .map(entry => entry[1])
                    .join('');

                try {
                    const decoded = decodeURIComponent(sorted);
                    
                    document.getElementById('receivedData').innerHTML = decoded;
                    document.getElementById('receivedData').classList.add('has-data');
                    document.getElementById('receivedBytes').textContent = new Blob([decoded]).size;

                    Toast.show('Veri basariyla alindi!', 'success');
                } catch (e) {
                    document.getElementById('receivedData').innerHTML = 'Cozumleme hatasi: ' + e.message;
                    Toast.show('Veri cozumlenemedi', 'error');
                }
            },

            copyData() {
                const data = document.getElementById('receivedData').textContent;
                if (data && !data.includes('Henuz veri') && !data.includes('Aliniyor')) {
                    navigator.clipboard.writeText(data);
                    Toast.show('Panoya kopyalandi', 'success');
                }
            },

            clearData() {
                this.receivedChunks.clear();
                this.totalChunks = null;
                document.getElementById('receivedChunks').textContent = '0';
                document.getElementById('totalChunks').textContent = '?';
                document.getElementById('receivedBytes').textContent = '0';
                document.getElementById('receiveChunkIndicator').innerHTML = '';
                document.getElementById('receivedData').innerHTML = '<div class="received-empty">Henuz veri alinmadi</div>';
                document.getElementById('receivedData').classList.remove('has-data');
                Toast.show('Veriler temizlendi', 'info');
            }
        };

        // Tab System
        const TabSystem = {
            init() {
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const tabId = btn.dataset.tab;
                        
                        // Update buttons
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        
                        // Update content
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        document.getElementById('tab-' + tabId).classList.add('active');
                    });
                });
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            TabSystem.init();
            QRTransfer.init();
            QRScanner.init();
            Toast.show('QR Transfer hazir', 'success');
        });
    </script>
</body>
</html>
